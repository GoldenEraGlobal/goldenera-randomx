name: Build and Release

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-randomx:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - x86_64
          - os: ubuntu-latest
            arch: x86_64
            cmake_args: '-DCMAKE_BUILD_TYPE=Release -DARCH=default -DBUILD_SHARED_LIBS=ON -DCMAKE_C_FLAGS="-fPIC" -DCMAKE_SHARED_LINKER_FLAGS="-z noexecstack"'
            artifact_name: "librandomx_linux_x86_64.so"
            output_lib: "librandomx_linux_x86_64.so"
            source_lib: "librandomx.so"
            test_binary: "randomx-tests"
            expected_file_pattern: "x86-64|x86_64"

          # Linux - aarch64
          - os: ubuntu-24.04-arm
            arch: aarch64
            cmake_args: '-DCMAKE_BUILD_TYPE=Release -DARCH=default -DBUILD_SHARED_LIBS=ON -DCMAKE_C_FLAGS="-fPIC" -DCMAKE_SHARED_LINKER_FLAGS="-z noexecstack"'
            artifact_name: "librandomx_linux_aarch64.so"
            output_lib: "librandomx_linux_aarch64.so"
            source_lib: "librandomx.so"
            test_binary: "randomx-tests"
            expected_file_pattern: "aarch64|ARM64"

          # macOS - x86_64
          - os: macos-15-intel # Intel-based runner; macos-13 was retired by GitHub
            arch: x86_64
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DARCH=default -DBUILD_SHARED_LIBS=ON"
            artifact_name: "librandomx_macos_x86_64.dylib"
            output_lib: "librandomx_macos_x86_64.dylib"
            source_lib: "librandomx.dylib"
            test_binary: "randomx-tests"
            expected_file_pattern: "x86_64"

          # macOS - Apple Silicon
          - os: macos-15
            arch: aarch64
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DARCH=default -DBUILD_SHARED_LIBS=ON"
            artifact_name: "librandomx_macos_aarch64.dylib"
            output_lib: "librandomx_macos_aarch64.dylib"
            source_lib: "librandomx.dylib"
            test_binary: "randomx-tests"
            expected_file_pattern: "arm64"

          # Windows - x86_64
          - os: windows-latest
            arch: x86_64
            cmake_args: '-G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DARCH=default -DBUILD_SHARED_LIBS=ON'
            artifact_name: "librandomx_windows_x86_64.dll"
            output_lib: "librandomx_windows_x86_64.dll"
            source_lib: "librandomx.dll"
            test_binary: "randomx-tests.exe"
            expected_file_pattern: "x86-64|x86_64"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install mingw -y
        shell: pwsh

      - name: Compile RandomX
        run: |
          cd RandomX
          mkdir -p build
          cd build

          echo "Configuring RandomX for ${{ matrix.os }}"
          cmake .. ${{ matrix.cmake_args }}

          # Build
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cmake --build . --config Release -j 4
          else
            make -j4
          fi

          # Create target directory
          mkdir -p ../../src/main/resources/native

          # Copy library with verification
          echo "Looking for library: ${{ matrix.source_lib }}"
          ls -la

          if [ -f "${{ matrix.source_lib }}" ]; then
            cp -v "${{ matrix.source_lib }}" "../../src/main/resources/native/${{ matrix.output_lib }}"
            echo "✅ Successfully copied ${{ matrix.source_lib }} to ${{ matrix.output_lib }}"
          else
            echo "❌ Error: Library file ${{ matrix.source_lib }} not found!"
            echo "Contents of build directory:"
            ls -la
            exit 1
          fi

          echo "Contents of native resources directory:"
          ls -la ../../src/main/resources/native/
        shell: bash

      - name: Run upstream native tests
        run: ./RandomX/build/${{ matrix.test_binary }}
        shell: bash
        timeout-minutes: 10

      - name: Verify library file
        run: |
          echo "Verifying library file in native resources directory"
          if [ -f "src/main/resources/native/${{ matrix.output_lib }}" ]; then
            echo "✅ Library file ${{ matrix.output_lib }} exists"
            file "src/main/resources/native/${{ matrix.output_lib }}" \
              | tee native-file-description.txt
            grep -E '${{ matrix.expected_file_pattern }}' native-file-description.txt
          else
            echo "❌ Library file ${{ matrix.output_lib }} is missing"
            echo "Contents of native directory:"
            ls -la src/main/resources/native/
            exit 1
          fi
        shell: bash

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Verify Java v1 consensus compatibility
        run: mvn -Dtest=RandomXConsensusRegressionTest test
        timeout-minutes: 10

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src/main/resources/native/${{ matrix.output_lib }}
          if-no-files-found: error

  build-java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-randomx
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Organize artifacts
        run: |
          mkdir -p src/main/resources/native/

          # Move all downloaded libraries to the native directory
          find artifacts/ -type f \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) -exec cp -v {} src/main/resources/native/ \;

          echo "Downloaded artifacts:"
          ls -la src/main/resources/native/
        shell: bash

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run tests
        run: mvn test
        timeout-minutes: 20

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: |
            target/*.jar
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build-java
    # Run only on push to main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # Required for creating GitHub Releases
      packages: write # Required for publishing to GitHub Packages
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          server-id: github

      - name: Extract Version from pom.xml
        id: extract_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Download JAR Artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-artifacts
          path: target/

      - name: Find Main JAR File
        id: find_jar
        run: |
          # Find the main JAR (exclude sources and javadoc)
          JAR_FILE=$(find target/ -type f -name "goldenera-randomx-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "❌ Error: No main JAR file found!"
            exit 1
          fi

          echo "Found JAR file: $JAR_FILE"
          echo "jar_file=$JAR_FILE" >> $GITHUB_ENV

          JAR_BASENAME=$(basename "$JAR_FILE")
          echo "jar_basename=$JAR_BASENAME" >> $GITHUB_ENV

      - name: Generate Release Notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          # goldenera-randomx v${{ env.VERSION }}

          ## What's Included

          This release includes the Java library with native RandomX bindings for multiple platforms.

          ## Native Libraries Included

          - **Linux**: x86_64, aarch64
          - **Windows**: x86_64
          - **macOS**: x86_64 (Intel), aarch64 (Apple Silicon)

          ## Installation

          Add to your Maven project:

          ```xml
          <dependency>
              <groupId>global.goldenera.randomx</groupId>
              <artifactId>goldenera-randomx</artifactId>
              <version>${{ env.VERSION }}</version>
          </dependency>
          ```

          Ensure you have the GitHub Package registry configured in your `pom.xml`.

          ## Performance Notes

          - **macOS Apple Silicon (M1/M2/M3)**: Use JIT + SECURE flags for optimal performance (~12x speedup)
          - All platforms support hardware AES acceleration when available
          EOF

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "v${{ env.VERSION }}" > /dev/null 2>&1; then
            echo "release_exists=true" >> $GITHUB_ENV
            echo "⚠️ Release v${{ env.VERSION }} already exists"
          else
            echo "release_exists=false" >> $GITHUB_ENV
            echo "✅ Release v${{ env.VERSION }} does not exist yet"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Delete existing release if it exists
        if: env.release_exists == 'true'
        run: |
          echo "Deleting existing release v${{ env.VERSION }}"
          gh release delete "v${{ env.VERSION }}" --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        run: |
          gh release create "v${{ env.VERSION }}" \
            --title "goldenera-randomx v${{ env.VERSION }}" \
            --notes-file RELEASE_NOTES.md \
            "${{ env.jar_file }}#goldenera-randomx.jar"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to GitHub Packages
        run: |
          echo "🚀 Publishing JAR to GitHub Packages..."
          mvn deploy:deploy-file \
            -DgroupId=global.goldenera.randomx \
            -DartifactId=goldenera-randomx \
            -Dversion=${{ env.VERSION }} \
            -Dpackaging=jar \
            -Dfile=${{ env.jar_file }} \
            -DpomFile=pom.xml \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/goldeneraglobal/goldenera-randomx \
            -Dusername=x-access-token \
            -Dpassword=${{ secrets.GITHUB_TOKEN }} \
            -DretryFailedDeploymentCount=3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
